<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Director Prompt Studio — Kevin AI Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/director-studio/studio.css">
</head>
<body data-theme="dark" data-view="wizard">
<div class="app">
  <header class="top">
    <div class="brand">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap">
        <a href="/prompts" target="_top" class="btn sm" style="text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:6px;background:rgba(245,158,11,0.12);border-color:rgba(245,158,11,0.35);color:#FBBF24">
          ← กลับสู่ Prompts Hub
        </a>
        <span class="eyebrow">Kevin AI Academy · Video Prompt Director</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <h1>Director Prompt Studio</h1>
        <span style="font-size:11px;font-family:var(--font-mono);font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(16,185,129,0.18);border:1px solid rgba(16,185,129,0.35);color:#34D399;letter-spacing:0.04em">PRO ENGINE 8-STEP</span>
      </div>
      <p class="muted small">ตอบทีละขั้นแบบผู้กำกับมืออาชีพ แล้วได้ Master Prompt พร้อม Identity Lock และจัดรูปแบบรองรับ MiniMax H3, Google Flow, Meta AI &amp; DreamRadar</p>
    </div>
    <div class="tools">
      <button class="btn sm ai" id="btnAiAll" type="button" hidden>✦ AI สุ่มทั้งโปรเจกต์</button>
      <button class="btn sm" id="btnAiCancel" type="button" hidden>ยกเลิก AI</button>
      <button class="btn sm primary" id="btnRndAll" type="button">🎲 สุ่มทั้งโปรเจกต์</button>
      <button class="btn sm" id="btnUndo" type="button" hidden>↶ เลิกสุ่ม</button>
      <button class="btn sm ghost" id="btnTheme" type="button" aria-label="สลับธีมสว่าง/มืด">◐ ธีม</button>
      <button class="btn sm ghost danger" id="btnReset" type="button">ล้างโปรเจกต์</button>
      <a href="/director-studio/index.html" target="_blank" rel="noopener noreferrer" class="btn sm ghost" style="text-decoration:none" title="เปิดแท็บใหม่แบบแยกอิสระ">↗ แท็บใหม่</a>
    </div>
  </header>

  <nav class="steps" id="steps" aria-label="ขั้นตอนการสร้าง Prompt"></nav>

  <div class="viewsw" role="group" aria-label="มุมมอง">
    <button class="btn sm" id="vwWizard" type="button" aria-pressed="true">① กรอกข้อมูล</button>
    <button class="btn sm" id="vwPrompt" type="button" aria-pressed="false">② ดู Prompt</button>
  </div>

  <main class="layout">
    <section id="stage" aria-live="polite"></section>
    <aside class="panel" id="panel" aria-label="Prompt ที่ประกอบแล้ว"></aside>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="/director-studio/studio.js"></script>
</body>
</html>
